name: 1. Daily Report (08:00 Berlin)

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 08:00 Berlin (CEST)
  workflow_dispatch:        # Allow manual trigger

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore credentials.json
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json

      - name: Send daily report to ntfy
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from tools.phone_notify import notify_daily_report
          notify_daily_report()
          print('Daily report sent.')
          "
