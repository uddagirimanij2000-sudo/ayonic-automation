name: 5. Reply Check (14:30 Berlin)

on:
  schedule:
    - cron: '30 12 * * *'  # 12:30 UTC = 14:30 Berlin (CEST)
  workflow_dispatch:

jobs:
  reply-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore credentials.json
        run: echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > credentials.json

      - name: Check for replies (sends ntfy instantly on reply)
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: python main.py check-replies
